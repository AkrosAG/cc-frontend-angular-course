<div class="container">
  <h2>{{ subtitle() }}</h2>

  <ul>
    @for (todo of todos(); track todo.id) {
      <li>{{ todo.label }}</li>
    } @empty {
      <li class="no-todos">Keine Einträge</li>
    }
  </ul>
  <button mat-raised-button color="warn" (click)="onClearClick()">Clear</button>
</div>
